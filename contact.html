    <main>

        <section aria-labelledby="contact-title">

            <h1 id="contact-title">
                Contact Me
            </h1>

            <p>
                Have a question or want to connect?
                Feel free to send me a message.
            </p>

        </section>


        <section aria-labelledby="form-title">

            <h2 id="form-title">
                Send a Message
            </h2>

            <form>

                <div>

                    <label for="name">
                        Name:
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div>

                    <label for="email">
                        Email:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div>

                    <label for="subject">
                        Subject:
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >

                </div>


                <div>

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>
